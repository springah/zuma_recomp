# Manual function hints for zuma (default.xex).
#
# Empty at bring-up. Seed entries here when the runtime reports
# "Call to invalid or unregistered function" (pointer-table targets the static
# scan missed) or when codegen mis-splits a function:
#
#   # The game's libjpeg error path is the classic setjmp/longjmp one: the loader
# (sub_82167AE8) calls setjmp before jpeg_read_header, and its error_exit
# (sub_82165BB8) longjmps back. Recompiled naively, longjmp just "returns" into
# libjpeg with the loader's stack pointer, so the next epilogue restores r27-r31
# from the wrong frame and read_markers dereferences cinfo == NULL. These two
# keys make codegen route the CRT entry points through ppc_setjmp/ppc_longjmp.
setjmp_address = 0x8235DBF0
longjmp_address = 0x8235D9A0

#   "0x8200XXXX" = {}                      # missed entry point
#   "0x8200YYYY" = { end = 0x8200ZZZZ }    # corrected extent

[functions]

# Exception-unwind funclets: a destructor loop ending in `bl 0x82111AD8`
# (li r3,0 / li r4,0 first -- a rethrow, which never returns). The analyzer does
# not know the callee is noreturn, so it ran past the bl through two words of
# padding into the next function, whose body then carried a `beq` to a label
# generated only in that next function ("use of undeclared label loc_820BA3D8").
# Cap each funclet right after its bl.
"0x820BA330" = { end = 0x820BA388 }   # ran into sub_820BA390
"0x820BDEF0" = { end = 0x820BDF48 }   # ran into sub_820BDF50
"0x821F3370" = {}  # boot FATAL: unregistered call target (seed loop r1)
